<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1190" viewBox="0 0 1250 1190"
     font-family="Noto Sans CJK KR, Nanum Gothic, sans-serif">
<style>
  .bx   { fill:#ffffff; stroke:#334155; stroke-width:1.6; rx:7; }
  .frz  { fill:#f1f5f9; stroke:#64748b; stroke-width:1.6; stroke-dasharray:none; }
  .trn  { fill:#ecfdf5; stroke:#16a34a; stroke-width:2.2; }
  .off  { fill:#fafafa; stroke:#cbd5e1; stroke-width:1.4; stroke-dasharray:5 4; }
  .grp  { fill:none; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 5; rx:10; }
  .t    { font-size:15px; fill:#0f172a; }
  .tb   { font-size:15.5px; font-weight:700; fill:#0f172a; }
  .ts   { font-size:12.5px; fill:#475569; }
  .tm   { font-size:12.5px; font-family:monospace; fill:#1e40af; }
  .tw   { font-size:12.5px; fill:#94a3b8; }
  .glab { font-size:12.5px; font-weight:700; fill:#64748b; letter-spacing:1.2px; }
  .ar   { stroke:#475569; stroke-width:1.8; fill:none; marker-end:url(#a); }
  .aro  { stroke:#cbd5e1; stroke-width:1.5; fill:none; stroke-dasharray:5 4; marker-end:url(#ao); }
  .dim  { font-size:12.5px; font-weight:700; fill:#b45309; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
</defs>

<rect x="0" y="0" width="1250" height="1190" fill="#ffffff"/>

<!-- ══ 입력 ══ -->
<rect class="bx" x="390" y="18" width="200" height="46"/>
<text class="tb" x="490" y="40" text-anchor="middle">카메라 입력</text>
<text class="ts" x="490" y="56" text-anchor="middle">1280 × 720 RGB</text>

<path class="ar" d="M440,64 L440,96 L250,96 L250,124"/>
<path class="ar" d="M540,64 L540,96 L720,96 L720,124"/>

<!-- ══ 인지 그룹 ══ -->
<rect class="grp" x="70" y="112" width="840" height="196"/>
<text class="glab" x="86" y="132">인지 · PERCEPTION  (전부 동결 frozen)</text>

<!-- OWL-v2 -->
<rect class="frz bx" x="110" y="142" width="280" height="88"/>
<text class="tb" x="250" y="166" text-anchor="middle">OWL-v2</text>
<text class="ts" x="250" y="185" text-anchor="middle">open-vocabulary 검출기 · 0.155B</text>
<text class="tm" x="250" y="204" text-anchor="middle">text prompt = "gray basket"</text>
<text class="ts" x="250" y="221" text-anchor="middle">zero-shot · 특화 학습 없음</text>

<!-- Kosmos-2 vision -->
<rect class="frz bx" x="580" y="142" width="280" height="88"/>
<text class="tb" x="720" y="166" text-anchor="middle">Kosmos-2 vision_model</text>
<text class="ts" x="720" y="185" text-anchor="middle">비전 타워 · 0.303B</text>
<text class="tm" x="720" y="204" text-anchor="middle">hidden 1024-dim</text>
<text class="ts" x="720" y="221" text-anchor="middle">선행연구 RoboVLMs 결과 승계</text>

<path class="ar" d="M720,230 L720,252"/>
<rect class="frz bx" x="580" y="252" width="280" height="46"/>
<text class="tb" x="720" y="272" text-anchor="middle">image_proj</text>
<text class="tm" x="720" y="290" text-anchor="middle">Linear 1024→256 + L2 norm · 0.262M</text>

<path class="ar" d="M250,230 L250,352"/>
<path class="ar" d="M720,298 L720,352"/>

<!-- ══ 프레임 특징 벡터 260 ══ -->
<rect class="bx" x="110" y="352" width="280" height="52"/>
<text class="tb" x="250" y="374" text-anchor="middle">bbox 4채널</text>
<text class="tm" x="250" y="393" text-anchor="middle">cx, cy, area, has_bbox</text>

<rect class="bx" x="580" y="352" width="280" height="52"/>
<text class="tb" x="720" y="374" text-anchor="middle">비전 256채널</text>
<text class="tm" x="720" y="393" text-anchor="middle">L2-normalized embedding</text>

<path class="ar" d="M250,404 L250,438 L420,438 L420,470"/>
<path class="ar" d="M720,404 L720,438 L560,438 L560,470"/>
<text class="ts" x="490" y="432" text-anchor="middle">concat (사영 없이 병치)</text>

<!-- 260-dim 스택 바 -->
<rect class="bx" x="150" y="470" width="680" height="96"/>
<text class="tb" x="490" y="494" text-anchor="middle">프레임 특징 벡터</text>
<text class="dim" x="490" y="514" text-anchor="middle">FRAME_DIM = 4 + 256 = 260</text>
<!-- bar -->
<rect x="230" y="528" width="16" height="24" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
<rect x="246" y="528" width="504" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text class="ts" x="238" y="546" text-anchor="middle" font-size="11">4</text>
<text class="ts" x="498" y="546" text-anchor="middle">256</text>
<text class="ts" x="222" y="546" text-anchor="end">bbox</text>
<text class="ts" x="760" y="546">vision</text>

<path class="ar" d="M490,566 L490,600"/>
<text class="tm" x="500" y="588">bbox 4채널 × bbox_scale 3.0</text>

<!-- ══ window ══ -->
<rect class="bx" x="230" y="600" width="520" height="76"/>
<text class="tb" x="490" y="622" text-anchor="middle">시간 윈도우</text>
<text class="tm" x="490" y="641" text-anchor="middle">window = 6 프레임 → flatten</text>
<text class="dim" x="490" y="661" text-anchor="middle">(6 × 260) = 1560차원</text>

<path class="ar" d="M490,676 L490,712"/>

<!-- ══ 정책 ══ -->
<rect class="grp" x="230" y="700" width="520" height="128"/>
<text class="glab" x="246" y="720">정책 · POLICY</text>
<rect class="trn bx" x="270" y="730" width="440" height="82"/>
<text class="tb" x="490" y="754" text-anchor="middle">MLP Action Head</text>
<text class="tm" x="490" y="773" text-anchor="middle">1560 → 512 → 128 → 8</text>
<text class="ts" x="490" y="792" text-anchor="middle">0.866M · 파이프라인에서 학습되는 유일한 구성요소</text>
<text class="ts" x="490" y="807" text-anchor="middle">ReLU + dropout 0.25 / 0.1</text>

<path class="ar" d="M490,828 L490,860"/>

<!-- ══ 출력 ══ -->
<rect class="bx" x="190" y="860" width="600" height="76"/>
<text class="tb" x="490" y="882" text-anchor="middle">헤드 출력 — 8클래스 로짓</text>
<text class="ts" x="490" y="903" text-anchor="middle">0 STOP · 1 FORWARD · 2 LEFT · 3 RIGHT</text>
<text class="ts" x="490" y="922" text-anchor="middle">4 FWD+LEFT · 5 FWD+RIGHT · 6 ROT_L · 7 ROT_R</text>

<path class="ar" d="M490,936 L490,968"/>

<!-- ══ 서빙 제어 ══ -->
<rect class="grp" x="150" y="956" width="680" height="150"/>
<text class="glab" x="166" y="976">제어 · SERVING CONTROL</text>
<rect class="bx" x="190" y="986" width="600" height="104"/>
<text class="tm" x="490" y="1008" text-anchor="middle">owlv2_thresh = 0.20   ·   grounding_skip_n = 3  (≈1.3 Hz, zero-order hold)</text>
<text class="tm" x="490" y="1028" text-anchor="middle">force_reground_on_miss   ·   회전 지속 0.4 s 제한   ·   연속 회전 차단</text>
<text class="tm" x="490" y="1048" text-anchor="middle">stop_mode = learned   +   콜드스타트 가드 3회</text>
<text class="ts" x="490" y="1072" text-anchor="middle">속도 크기는 사용하지 않음 — 펌웨어가 방향만 반영(상수 속도)</text>

<path class="ar" d="M490,1106 L490,1136"/>
<rect class="bx" x="350" y="1136" width="280" height="36"/>
<text class="tb" x="490" y="1159" text-anchor="middle">로봇 속도 명령</text>

<!-- ══ 미사용 언어 디코더 (오른쪽 독립 열) ══ -->
<rect class="off bx" x="950" y="152" width="270" height="96"/>
<text class="tb" x="1085" y="176" text-anchor="middle" fill="#94a3b8">Kosmos-2 언어 디코더</text>
<text class="tw" x="1085" y="196" text-anchor="middle">1.361B</text>
<text class="tw" x="1085" y="215" text-anchor="middle">호출 0회 · 로드하지 않음</text>
<text class="tw" x="1085" y="234" text-anchor="middle">peak host RAM 10.59 → 3.20 GB</text>
<path class="aro" d="M862,186 L944,186"/>
<text class="tw" x="903" y="176" text-anchor="middle">미사용</text>
<line x1="895" y1="178" x2="911" y2="194" stroke="#cbd5e1" stroke-width="2"/>
<line x1="911" y1="178" x2="895" y2="194" stroke="#cbd5e1" stroke-width="2"/>

<!-- ══ 범례 ══ -->
<rect x="70" y="1136" width="16" height="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text class="ts" x="94" y="1149">학습</text>
<rect x="150" y="1136" width="16" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text class="ts" x="174" y="1149">동결</text>
<rect x="230" y="1136" width="16" height="16" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.4"
      stroke-dasharray="4 3"/>
<text class="ts" x="254" y="1149">미사용</text>
<text class="ts" x="1220" y="1149" text-anchor="end">연산 0.459B  ·  학습 0.866M  ·  호스트 적재 0.459B</text>
</svg>

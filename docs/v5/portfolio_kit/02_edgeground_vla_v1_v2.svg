    <!-- Bar 2: 근접 무충돌 정지 (의자) -->
    <text x="578" y="388" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" fill="#475569">의자 근접 정지</text>
    <rect x="688" y="376" width="290" height="16" rx="4" fill="#f1f5f9"/>
    <rect x="688" y="376" width="81" height="16" rx="4" fill="#fb923c"/>
    <rect x="688" y="376" width="270" height="16" rx="4" fill="url(#greenGrad)" fill-opacity="0.88"/>
    <text x="986" y="388" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#047857">28% → 93%</text>

    <!-- Bar 3: 비목표 지시어 안전 차단 -->
    <text x="578" y="418" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" fill="#475569">부정 명령 정지</text>
    <rect x="688" y="406" width="290" height="16" rx="4" fill="#f1f5f9"/>
    <rect x="688" y="406" width="288" height="16" rx="4" fill="url(#blueGrad)"/>
    <text x="986" y="418" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">99.5% (V4R)</text>

    <!-- Bar 4: 추론 지연 단축 -->
    <text x="578" y="448" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" fill="#475569">추론 지연(ms)</text>
    <rect x="688" y="436" width="290" height="16" rx="4" fill="#fee2e2"/>
    <rect x="688" y="436" width="140" height="16" rx="4" fill="url(#purpleGrad)"/>
    <text x="986" y="448" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">285ms (-52%)</text>

    <text x="578" y="478" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="10" fill="#64748b">* 모든 실기 지표는 Jetson Orin NX + Serbot 2 실환경 주행 로그(.h5 / session JSON) 기준</text>
    
</svg>
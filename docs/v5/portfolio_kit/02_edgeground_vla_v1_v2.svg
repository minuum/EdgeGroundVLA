    <rect x="578" y="140" width="232" height="82" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="592" y="160" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">EGVLA 1 · 훈련/미학습 위치</text>
    <text x="592" y="191" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">95.0% / 92.0%</text>
    <text x="592" y="211" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#475569">95/100 (훈련) · 276/300 (미학습 포함)</text>

    <rect x="822" y="140" width="232" height="82" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="836" y="160" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#047857">EGVLA 2 · 미학습 물체 실기</text>
    <text x="836" y="191" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" fill="#0f172a">45/45 · 접촉 0건</text>
    <text x="836" y="211" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#475569">바구니 30/30 + 미학습 의자 15/15 (11/25)</text>

    <rect x="578" y="232" width="232" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="592" y="252" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#334155">추론 서빙 지연 (End-to-End)</text>
    <text x="592" y="280" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#059669">591ms → 285ms</text>
    <text x="592" y="297" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#475569">2.09× 가속 · beam=3 대비 99.7% 일치</text>

    <rect x="822" y="232" width="232" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="836" y="252" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" font-weight="700" fill="#334155">조향 정합 · 파라미터 효율</text>
    <text x="836" y="280" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#2563eb">0.54° · 0.25%</text>
    <text x="836" y="297" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="10.5" fill="#475569">핸들 각도 차 1° 미만 · 1.128M/459M</text>

    <!-- 하단 바 차트 -->
    <text x="578" y="334" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="12" font-weight="700" fill="#334155">실기 주요 지표 비교 (Baseline vs Proposed)</text>

    <!-- Bar 1: 미학습 의자 정중앙 출발 -->
    <text x="578" y="358" font-family="NanumBarunGothic, Noto Sans CJK KR, sans-serif" font-size="11" fill="#475569">의자 중앙 출발</text>
    <rect x="688" y="346" width="290" height="16" rx="4" fill="#f1f5f9"/>
    <rect x="688" y="346" width="290" height="16" rx="4" fill="url(#greenGrad)"/>
